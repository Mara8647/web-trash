{% extends "base.html" %}
{% block title %}Создание сотрудника{% endblock %}
{% block content %}
<style>
    .switch-line {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid rgb(231, 231, 231);
    }
</style>
<form method="POST" id="mainForm">
    <div class="mb-3 mt-3 container">
        <label class="form-label">ФИО</label>
        <input type="text" class="form-control" name="full_name" id="full_name" placeholder="Например: Иванов Иван Иванович" required autofocus>
    </div>

    <div class="mb-3 mt-3 container">
        <label class="form-label">Отдел</label>
        <input type="text" class="form-control" name="department" id="department" placeholder="Например: Отдел продаж" required >
    </div>

    <div class="mb-3 mt-3 container">
        <label class="form-label">Должность</label>
        <input type="text" class="form-control" name="position" id="position" placeholder="Например: Менеджер продаж" required >
    </div>

    <div class="mb-3 mt-3 container">
        <label class="form-label">Руководитель</label>
        <input type="text" class="form-control" name="manager" id="manager" placeholder="Например: Петров Пётр" required >
    </div>

    <div class="mb-3 mt-3 container">
        <label class="form-label">Дата выхода</label>
        <input type="date" class="form-control" name="start_date" id="start_date" required>
    </div>

    <div class="mb-3 mt-3 container">
        <label class="form-label">Домен почты</label>
        <input type="text" class="form-control" name="email_domain" id="email_domain" placeholder="company.local" required>
    </div>

    <!-- Поле ролей -->
    <div class="container">
        <ul class="list-group list-group-light">
            <li class="list-group-item">
                <input class="form-check-input me-1" type="radio" name="role_id" value="1">
                Кладовщик
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="radio" name="role_id" value="2">
                Менеджер продаж
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="radio" name="role_id" value="3">
                Бухгалтер
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="radio" name="role_id" value="4">
                Руководитель
            </li>
            <li class="list-group-item">
                <input class="form-check-input me-1" type="radio" name="role_id" value="5">
                IT
            </li>
        </ul>
    </div>

    <div class="container p-3">
        <div class="container pt-2 card">
            <h3 class="mb-3">Что создать?</h3>
            <label class="switch-line">
                <input type="checkbox" name="need_email">Почта
            </label>
            <label class="switch-line">
                <input type="checkbox" name="need_vpn">VPN
            </label>
            <label class="switch-line">
                <input type="checkbox" name="need_onec">1C
            </label>
            <label class="switch-line">
                <input type="checkbox" name="need_bitrix">Bitrix
            </label>
        </div>
    </div>

    <div class="text-center pt-3 pb-3">
        <button type="submit" class="btn btn-primary" id="nextButton">Создать сотрудника</button>
    </div>
</form>
<script>
    const textFields = ['full_name', 'department', 'position', 'manager', 'start_date', 'email_domain'];
    const radioGroups = ['role_id'];
    const checkboxes = ['need_email', 'need_vpn', 'need_onec', 'need_bitrix'];

    // Restore and save text fields
    textFields.forEach(field => {
        const el = document.querySelector(`[name="${field}"]`);
        if (!el) return;

        const saved = localStorage.getItem(`employee_form_${field}`);
        if (saved) el.value = saved;

        el.addEventListener('input', () => {
            localStorage.setItem(`employee_form_${field}`, el.value);
        });
    });

    // Restore and save radio groups
    radioGroups.forEach(group => {
        const radios = document.querySelectorAll(`[name="${group}"]`);
        if (!radios.length) return;

        const saved = localStorage.getItem(`employee_form_${group}`);
        if (saved) {
            radios.forEach(radio => {
                if (radio.value === saved) radio.checked = true;
            });
        }

        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                localStorage.setItem(`employee_form_${group}`, radio.value);
            });
        });
    });

    // Restore and save checkboxes
    checkboxes.forEach(field => {
        const el = document.querySelector(`[name="${field}"]`);
        if (!el) return;

        const saved = localStorage.getItem(`employee_form_${field}`);
        if (saved) el.checked = (saved === 'true');

        el.addEventListener('change', () => {
            localStorage.setItem(`employee_form_${field}`, el.checked);
        });
    });

    // Clear all saved data on submit
    document.getElementById('mainForm').addEventListener('submit', () => {
        [...textFields, ...radioGroups, ...checkboxes].forEach(field => {
            localStorage.removeItem(`employee_form_${field}`);
        });
    });
</script>
{% endblock %}

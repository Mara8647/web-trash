{% extends 'base.html' %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<div class="p-2">
    <table class="table align-middle table-hover rounded">
        <thead><tr><th>ID</th><th>ЛОГИН</th><th>ДОСТУП</th><th>ДЕЙСТВИЕ</th></tr></thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.login }}</td>
                <td>{{ user.access }}</td>
                <td>
                    <form method="post">
                        <input type="hidden" name="user_id" value="{{ user.id }}">
                        <button class="btn btn-primary btn-sm" type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

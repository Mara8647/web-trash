<!DOCTYPE html>
<html>
    <head>
        <title>VS</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-3">
            <h2  style="text-align: center;">Добро пожаловать в VS Access Panel</h2>
            <div class="pt-5">
                <div class="alert alert-danger text-center">
                    Неверно введён логин или пароль
                </div>
            </div>
            <form method="post">
                <div class="mt-5">
                    <label for="login">Логин</label>
                    <input type="text" id="login" class="form-control" name="login">
                </div>
                <div class="mt-3">
                    <label for="password">Пароль</label>
                    <input type="password" id="login" class="form-control" name="password">
                </div>
                <div class="mt-5 text-center">
                    <button type="submit" class="btn btn-lg btn-primary">Войти</button>
                </div>
            </form>
        </div>
    </body>
</html>

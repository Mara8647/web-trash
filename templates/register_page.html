<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Register page</title>
    </head>
    <body>
        <form method="POST" id="mainForm">
            <div class="mb-3 container">
                <label class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" name="username" placeholder="например: Иван Иванов" required>
            </div>
    
            <div class="mb-3 container">
                <label class="form-label">Email пользователя</label>
                <input type="text" class="form-control" name="email" placeholder="например: Иван Иванов" required>
            </div>

            <div class="mb-3 container">
                <label class="form-label">Введите пароль</label>
                <input type="password" class="form-control" name="password" placeholder="например: 123aBc_456" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary" id="nextButton">Зарегистрировать пользователя</button>
            </div>
        </form>
    </body>
</html>

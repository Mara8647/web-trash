<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Регистрация</title>
        <style>
            .btn {
                padding: 10px 25px;
                font-weight: 600;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <form method="POST" id="mainForm">
            <div class="mb-3 container">
                <label class="form-label">Логин</label>
                <input type="text" class="form-control" name="username" placeholder="например: Иван Иванов" required>
            </div>

            <div class="mb-3 container">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control" name="password" placeholder="например: 123aBc_456" required>
            </div>

            <!-- Поле сервисов -->
            <div id="servicesField" class="mb-4 text-center">
                <label class="form-label">Сервисы</label>
                <div id="servicesCheckboxes" class = "d-flex flex-wrap gap-2 p-2 border rounded"></div>
                <input type="hidden" name="services" id="servicesInput" value="none">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary" id="nextButton">Зарегистрировать пользователя</button>
            </div>
        </form>
    </body>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const servicesField = document.getElementById('servicesField');
            const servicesContainer = document.getElementById('servicesCheckboxes');
            const servicesInput = document.getElementById('servicesInput');

            const servicesList = [
                {value: 'vpn', label: 'VPN'},
                {value: 'mail', label: 'Почта'},
                {value: '1С', label: '1С'},
                {value: 'bitrix', label: 'Bitrix24'}
            ];

            function initServicesButtons() {
                if (servicesContainer.children.lentgth > 0) return;

                const selected = new Set();
    
                servicesList.forEach(item =>{
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-outline-secondary btn-sm';
                    btn.textContent = item.label;
                    btn.dataset.value = item.value;
    
                    btn.addEventListener('click', () => {
                        if (selected.has(item.value)) {
                            selected.delete(item.value);
                            btn.classList.remove('btn-primary');
                            btn.classList.add('btn-outline-secondary');
                        } else {
                            selected.add(item.value);
                            btn.classList.remove('btn-outline-secondary');
                            btn.classList.add('btn-primary');
                        }
                        servicesInput.value = selected.size > 0 ? Array.from(selected).join(',') : 'none';
                    });
    
                    servicesContainer.appendChild(btn);
                });
            }

            initServicesButtons();
        });
    </script>
</html>

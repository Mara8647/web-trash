<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Регистрация</title>
        <style>
            .btn {
                padding: 10px 25px;
                font-weight: 600;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <form method="POST" id="mainForm">
            <div class="mb-3 mt-3 container">
                <label class="form-label">ФИО</label>
                <input type="text" class="form-control" name="username" placeholder="Например: Иван Иванов" required>
            </div>

            <div class="mb-3 container">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control" name="password" placeholder="Например: 123aBc_456" required>
            </div>

            <!-- Поле сервисов -->
            <div class="container">
                <ul class="list-group list-group-light">
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="checkbox" name="options" value="vpn">
                        Почта
                    </li>
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="checkbox" name="options" value="mail">
                        VPN
                    </li>
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="checkbox" name="options" value="1c">
                        1С
                    </li>
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="checkbox" name="options" value="bitrix">
                        Bitrix24
                    </li>
                </ul>
            </div>

            <div class="text-center pt-3">
                <button type="submit" class="btn btn-primary" id="nextButton">Создать сотрудника</button>
            </div>
        </form>
    </body>
</html>

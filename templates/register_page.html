<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Регистрация</title>
        <style>
            .btn {
                padding: 10px 25px;
                font-weight: 600;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <form method="POST" id="mainForm">
            <div class="mb-3 container">
                <label class="form-label">Логин</label>
                <input type="text" class="form-control" name="username" placeholder="например: Иван Иванов" required>
            </div>

            <div class="mb-3 container">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control" name="password" placeholder="например: 123aBc_456" required>
            </div>

            <!-- Поле сервисов -->
            <div class="form-check" style="justify-content: center; align-items: center;">
                <input class="form-check-input" type="checkbox"  value="" id="check1">
                <label class="form-check-label" for="check1">
                    Default checkbox
                </label>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary" id="nextButton">Зарегистрировать пользователя</button>
            </div>
        </form>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Регистрация</title>
        <style>
            .btn {
                padding: 10px 25px;
                font-weight: 600;
                border-radius: 10px;
            }

            .card {
                width: 320px;
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
            }
        </style>
    </head>
    <body>
        <form method="POST" id="mainForm">
            <div class="mb-3 mt-3 container">
                <label class="form-label">ФИО</label>
                <input type="text" class="form-control" name="name" placeholder="Например: Иванов Иван Иванович" required autofocus>
            </div>

            <!-- Поле ролей -->
            <div class="container">
                <ul class="list-group list-group-light">
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="radio" name="role" value="storage_worker">
                        Кладовщик
                    </li>
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="radio" name="role" value="sales_manager">
                        Менеджер продаж
                    </li>
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="radio" name="role" value="accountant">
                        Бухгалтер
                    </li>
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="radio" name="role" value="supervisor">
                        Руководитель
                    </li>
                    <li class="list-group-item">
                        <input class="form-check-input me-1" type="radio" name="role" value="it">
                        IT
                    </li>
                </ul>
            </div>

            <div class="text-center pt-3">
                <button type="submit" class="btn btn-primary" id="nextButton">Создать сотрудника</button>
            </div>
        </form>
    </body>
</html>

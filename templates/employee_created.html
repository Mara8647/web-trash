<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <title>Сотрудник создан</title>
    </head>
    <style>
        .created-card { max-width: 880px; margin: 30px auto; background: white; border: 1px solid var(--line); border-radius: 30px; padding: 38px; text-align: center; box-shadow: 0 20px 50px rgba(23,32,51,.08); }
        .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .card-head h3, .panel-card h3 { font-size: 18px; font-weight: 800; margin: 0; }
    </style>
    <body>
        <div class="pt-5 container" style="justify-content: center; text-align: center;">
            <div class="created-card">
                <div class="card-head">
                    <h3>Карточка создана. Ниже одноразовые стартовые данные для передачи ответственному.</h3>
                </div>
                <div class="card-body">
                    <p class="alert alert-warning p-1">&#9888 Пароль показан только на этом экране и не будет сохранён в базе</p>
                    <p>Ваш логин: {{ login }}</p>
                    <p>Ваш email: {{ email }}</p>
                    <p>Ваш временный пароль: {{ temp_password }}</p>
                    <p>Ваша роль: {{ role }}</p>
                </div>
            </div>
        </div>
    </body>
</html>

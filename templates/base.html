<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='laina_logo.png') }}">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    </head>
    <body>
        <nav class="sidebar gap-2 p-2" style="background: linear-gradient(45deg, #fb65a1 0%, #000000 90%);">
            <a class="p-2 border text-center" style="text-decoration: none; border-radius: 10px; background-color: #ffffff22; color:#ffffff" href="#"><b>Laina</b></a>
            <a class="border border-0 pe-2" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/dashboard">Панель</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/users">Пользователи</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/create_user">Создать пользователя</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/integrations">Интеграции</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/requests">Заявки</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/employees">Сотрудники</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/create_employee">Создать сотрудника</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/access_matrix">Матрица доступов</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ffffffa9" href="/roles">Роли</a>
            <a class="border border-0" style="border-radius: 10px; padding: 8px 24px; color:#ff0000b4" href="/logout">Выйти</a>
        </nav>
        <main style="margin-left: 220px; padding: 20px">
            {% block content %}{% endblock %}
        </main>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %}{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='laina_logo.png') }}">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    </head>
    <style>
        .created-card { max-width: 800px; background: white; border: 1px solid var(--line); border-radius: 30px; padding: 24px; box-shadow: 20px 20px 50px 12px rgba(23,32,51,.08); }
        .card-head { display: flex; justify-content: space-between; margin-bottom: 16px; }
        .card-head h3{ font-size: 18px; font-weight: 800; margin: 0; }
        .switch-line {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid rgb(231, 231, 231);
        }
    </style>
    <body>
        <nav class="navbar navbar-expand-sm navbar-dark" style="background: linear-gradient(45deg, #fb65a1 0%, #000000 70%);">
            <div class="container-fluid">
                <a class="navbar-brand border ps-2 pe-2" style="border-radius: 10px; background-color: #ffffff22;" href="#"><b>Laina</b></a>
                <ul class="navbar-nav">
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/dashboard">Панель</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/users">Пользователи</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/create_user">Создать пользователя</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/integrations">Интеграции</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/requests">Заявки</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/employees">Сотрудники</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/create_employee">Создать сотрудника</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ffffff7c solid 1px; border-radius: 5pt; color:#ffffff" class="nav-link" href="/roles">Роли</a>
                    </li>
                    <li class="nav-item p-1">
                        <a style="border: #ff0000b4 solid 1px; border-radius: 5pt; color:#ff0000b4" class="nav-link" href="/logout">Выйти</a>
                    </li>
                </ul>
            </div>
        </nav>
        {% block content %}{% endblock %}
    </body>
</html>

services:
  db:
    image: vs:latest
    container_name: vs-access-panel
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: "main_db"
      PGDATA: "/var/lib/postgresql/data"
    ports:
      - 2345:5432
      - 50:50
    volumes:
      - ./pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local